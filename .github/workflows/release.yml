name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) { throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match package version '+p.version) }"
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: mac-arm64
            command: npx electron-builder --mac --arm64 --publish never
            files: release/*.dmg
          - os: macos-15-intel
            artifact: mac-x64
            command: npx electron-builder --mac --x64 --publish never
            files: release/*.dmg
          - os: windows-latest
            artifact: windows-x64
            command: npx electron-builder --win --x64 --publish never
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: npm run icon
      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum * | sort -k 2 > ../SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* SHA256SUMS.txt --verify-tag --generate-notes --title "kangaroo-pocket $GITHUB_REF_NAME"
